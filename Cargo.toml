[package]
name = "htmd"
version = "0.5.5"
edition = "2024"
authors = ["letmutex"]
description = "A turndown.js inspired HTML to Markdown converter."
license = "Apache-2.0"
repository = "https://github.com/letmutex/htmd"
homepage = "https://github.com/letmutex/htmd"
keywords = ["html", "markdown", "converter"]
categories = ["text-processing", "parsing"]
readme = "README.md"

[features]
default = ["ego-tree"]
ego-tree = ["dep:ego-tree"]
rcdom = ["dep:markup5ever_rcdom"]

[dependencies]
ego-tree = { version = "0.11", optional = true }
html5ever = "0.40"
markup5ever_rcdom = { version = "0.40", optional = true }

[dev-dependencies]
indoc = "2.0.6"
scraper = "0.29"
criterion = { version = "0.8", features = ["html_reports"] }
pretty_assertions = "1.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.13.4"
unicode-properties = "0.1.5"

[[bench]]
name = "convert_bench"
harness = false

[[bench]]
name = "str_concat_bench"
harness = false

[profile.release]
debug = true
