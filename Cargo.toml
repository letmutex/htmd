[package]
name = "htmd"
version = "0.5.5"
edition = "2024"
authors = ["letmutex"]
description = "A turndown.js inspired HTML to Markdown converter."
license = "Apache-2.0"
repository = "https://github.com/letmutex/htmd"
homepage = "https://github.com/letmutex/htmd"
keywords = ["html", "markdown", "converter"]
categories = ["text-processing", "parsing"]
readme = "README.md"

[dependencies]
html5ever = "0.38"
markup5ever_rcdom = "0.38"
phf = { version = "0.13.1", features = ["macros"] }

[dev-dependencies]
indoc = "2.0.6"
scraper = "0.26"
ego-tree = "0.11"
criterion = { version = "0.8", features = ["html_reports"] }
pretty_assertions = "1.4.1"
# Reads the Markdown the tests produce back as CommonMark, so a test can assert
# that a conversion round-trips rather than that it looks right.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Parses the `data-options` of a turndown case, so that a key the runner does not
# know is a test failure rather than a silent fall back to the defaults.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "convert_bench"
harness = false

[[bench]]
name = "str_concat_bench"
harness = false

[profile.release]
debug = true
