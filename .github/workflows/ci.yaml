name: Cargo Build & Test

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Rust project - latest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update Rust
        run: rustup update stable && rustup default stable

      - name: Add Clippy
        run: rustup component add clippy

      - name: Build
        run: |
          cargo build --verbose
          cargo build --verbose --all-features
          cargo build --verbose --no-default-features --features rcdom

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: |
          cargo clippy --all-targets -- --deny warnings
          cargo clippy --all-targets --all-features -- --deny warnings
          cargo clippy --all-targets --no-default-features --features rcdom -- --deny warnings

      - name: Test
        run: |
          cargo test --verbose
          cargo test --verbose --all-features
          cargo test --verbose --no-default-features --features rcdom
